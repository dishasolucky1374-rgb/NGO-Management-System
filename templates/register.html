{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - NGO Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body style="background-color: #f8f9fa;">

    <!-- Navbar -->
    <nav class="navbar navbar-dark" style="background-color: #176B87;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                NGO Management System
            </a>

            <a class="btn btn-light" href="{% url 'home' %}">
                Home
            </a>
        </div>
    </nav>

    <!-- Registration Section -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold" style="color: #176B87;">
                                Create an Account
                            </h2>

                            <p class="text-muted">
                                Join the NGO Management System
                            </p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">

                            {% csrf_token %}

                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Username
                                </label>

                                <input type="text"
                                       name="username"
                                       class="form-control"
                                       placeholder="Enter your username"
                                       required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Email Address
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="Enter your password"
                                       required>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Confirm Password
                                </label>

                                <input type="password"
                                       name="confirm_password"
                                       class="form-control"
                                       placeholder="Confirm your password"
                                       required>
                            </div>

                            <!-- Register Button -->
                            <div class="d-grid mt-4">

                                <button type="submit"
                                        class="btn"
                                        style="background-color: #176B87; color: white;">
                                    Register
                                </button>

                            </div>

                        </form>

                        <div class="text-center mt-4">

                            <p class="mb-1">
                                Already have an account?
                            </p>

                            <a href="{% url 'login' %}"
                               style="color: #176B87; font-weight: bold;">
                                Login
                            </a>

                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
